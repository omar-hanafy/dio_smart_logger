name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.created && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          old_version=$(git show "$BEFORE_SHA:pubspec.yaml" | yq -er '.version')
          version=$(yq -er '.version' pubspec.yaml)
          if [[ "$version" == "$old_version" ]]; then
            echo "The version is still $version."
            exit 0
          fi

          package=$(yq -er '.name' pubspec.yaml)
          if [[ "$package" != dio_smart_logger ]]; then
            echo "Unexpected package name $package."
            exit 1
          fi
          core='[0-9]+\.[0-9]+\.[0-9]+'
          identifiers='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          if [[ "$GITHUB_REF_NAME" == main && ! "$version" =~ ^$core(\+$identifiers)?$ ]]; then
            echo "main requires a stable version, got $version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == dev && ! "$version" =~ ^$core-$identifiers(\+$identifiers)?$ ]]; then
            echo "dev requires a prerelease version, got $version."
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="[$version]" '
            /^##[[:space:]]/ {
              if (found) exit
              found = ($2 == version)
              next
            }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "Missing release notes for $version in CHANGELOG.md."
            exit 1
          fi

          echo "tag=$package-v$version" >> "$GITHUB_OUTPUT"

      - name: Push immutable tag
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi
          gh auth setup-git
          git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$GITHUB_REF_NAME" == dev ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
