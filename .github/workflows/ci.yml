name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (stable)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Version channel check
        env:
          TARGET_LANE: ${{ github.base_ref || github.ref_name }}
        shell: bash
        run: |
          version=$(yq -er '.version' pubspec.yaml)
          core='[0-9]+\.[0-9]+\.[0-9]+'
          identifiers='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          if [[ "$TARGET_LANE" == main && ! "$version" =~ ^$core(\+$identifiers)?$ ]]; then
            echo "main requires a stable version, got $version."
            exit 1
          fi
          if [[ "$TARGET_LANE" == dev && ! "$version" =~ ^$core-$identifiers(\+$identifiers)?$ ]]; then
            echo "dev requires a prerelease version, got $version."
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (beta)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: beta

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (stable)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.19

      - name: Run pana
        run: pana --exit-code-threshold 0 .
